<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Class 9 Science Tutor</title>
<script>
/* Which subject to open: kept in window.name (survives reloads in this tab) and localStorage when allowed. */
(function(){
  var s=null;
  try{ s=JSON.parse(window.name||'{}').subj; }catch(e){}
  if(!s){ try{ s=localStorage.getItem('c9.subj'); }catch(e){} }
  var SUBJECTS={chem:{id:'chem',name:'Chemistry',dir:'data/',ur:'کیمیا'},phy:{id:'phy',name:'Physics',dir:'phy/',ur:'طبیعیات'}};
  window.SUBJECTS=SUBJECTS;
  window.SUBJECT=SUBJECTS[s]||SUBJECTS.chem;
  document.documentElement.setAttribute('data-subj',window.SUBJECT.id);
  document.write('<script src="'+window.SUBJECT.dir+'meta.js"><\/script>');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: lab-notebook app. Sidebar on wide screens, bottom bar on phones; chapters shown as periodic-table cells. */
:root{
  --ink:#16263a;          /* body text */
  --muted:#5b6b7e;
  --paper:#f6f8fb;        /* page */
  --card:#ffffff;
  --line:#dbe3ec;
  --accent:#1b6fa8;       /* copper-sulfate blue */
  --accent-soft:#e3f0f9;
  --flame:#d9661f;        /* flame-test orange, used sparingly */
  --good:#1f8a5b; --good-soft:#e2f4eb;
  --warn:#b7791f; --warn-soft:#fbf1dc;
  --bad:#c0392b;  --bad-soft:#fbe6e3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting","Noto Naskh Arabic",serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e4ebf3; --muted:#9aabbd; --paper:#0f1722; --card:#172231; --line:#2a3a4e;
    --accent:#5aa9e0; --accent-soft:#16324a; --flame:#f08a4b;
    --good:#4cc38a; --good-soft:#143326; --warn:#e0b04f; --warn-soft:#3a2f14; --bad:#ef7564; --bad-soft:#3d1c18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e4ebf3; --muted:#9aabbd; --paper:#0f1722; --card:#172231; --line:#2a3a4e;
  --accent:#5aa9e0; --accent-soft:#16324a; --flame:#f08a4b;
  --good:#4cc38a; --good-soft:#143326; --warn:#e0b04f; --warn-soft:#3a2f14; --bad:#ef7564; --bad-soft:#3d1c18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0 0 .5em}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.12rem} h4{font-size:1rem}
p{margin:0 0 .7em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
sub,sup{font-size:.72em;line-height:0}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;margin:0 4px 14px}
.brand .cell{width:42px;height:42px;border:2px solid var(--accent);border-radius:6px;display:grid;place-items:center;font:700 1.05rem var(--f-display);color:var(--accent);position:relative}
.brand .cell small{position:absolute;top:1px;left:4px;font-size:.55rem}
.brand b{font:700 .98rem/1.15 var(--f-display)}
.brand span{font-size:.78rem;color:var(--muted)}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}
.nav a:hover{background:var(--accent-soft)}
.nav a[aria-current="page"]{background:var(--accent);color:#fff}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:8px 6px}
.main{min-width:0;padding:22px clamp(16px,3vw,36px) 90px}
.bar{display:none}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .side{display:none}
  .bar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  .bar a{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.7rem;font-weight:600;text-decoration:none;color:var(--muted);padding:5px 0;border-radius:8px}
  .bar a[aria-current="page"]{color:var(--accent)}
  .bar svg{width:22px;height:22px}
  .main{padding-bottom:96px}
  body{font-size:16px}
}
/* generic UI */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h3{margin-bottom:.35em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.93rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.75rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.p-ai{background:var(--accent-soft);color:var(--accent)}
.p-tb{background:var(--good-soft);color:var(--good)}
.p-pp{background:var(--warn-soft);color:var(--warn)}
.p-mp{background:#efe6fa;color:#6b3fa0}
:root[data-theme="dark"] .p-mp{background:#2e2340;color:#c7a6f0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p-mp{background:#2e2340;color:#c7a6f0}}
.p-s{background:var(--good-soft);color:var(--good)} .p-f{background:var(--line);color:var(--muted)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.meter{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.meter.good>i{background:var(--good)}
input[type=text],input[type=search],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:140px;resize:vertical}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.tbl{overflow-x:auto;margin:.6em 0 1em}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:700}
td{font-variant-numeric:tabular-nums}
/* chapter cells */
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cellx{position:relative;display:block;aspect-ratio:1/1.05;border:2px solid var(--line);border-radius:8px;background:var(--card);text-decoration:none;color:var(--ink);padding:6px 8px;overflow:hidden}
.cellx:hover{border-color:var(--accent)}
.cellx .n{font:700 .78rem var(--f-display);color:var(--muted)}
.cellx .s{font:700 1.7rem/1 var(--f-display);margin-top:4px;color:var(--accent)}
.cellx .t{font-size:.72rem;line-height:1.15;margin-top:5px;display:block}
.cellx .pc{position:absolute;right:7px;top:5px;font-size:.7rem;font-weight:700;color:var(--muted)}
.cellx .fill{position:absolute;left:0;bottom:0;height:5px;background:var(--good)}
.cellx.done{border-color:var(--good)}
.cellx.done .s{color:var(--good)}
/* chapter page */
.chhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:12px}
.chhead .big{flex:none;width:72px;height:76px;border:2px solid var(--accent);border-radius:8px;padding:4px 7px;background:var(--card)}
.chhead .big .n{font:700 .8rem var(--f-display);color:var(--muted)}
.chhead .big .s{font:700 1.9rem/1 var(--f-display);color:var(--accent);margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x proximity;position:sticky;top:0;background:var(--paper);z-index:5}
.tabs button{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:600;font-size:.86rem;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs button .k{color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"] .k{color:inherit;opacity:.7}
.topicnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.topicnav a{font-size:.8rem;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent);text-decoration:none;font-weight:600}
.topicnav a.d{background:var(--good-soft);color:var(--good)}
.topic{scroll-margin-top:64px}
.topic + .topic{margin-top:14px}
.topic .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.prose{max-width:72ch}
.prose ul,.prose ol{margin:.2em 0 .8em;padding-left:1.3em}
.prose li{margin:.15em 0}
.kp{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:.6em 0}
.tip{border-left:4px solid var(--flame);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:.6em 0}
.ur{font-family:var(--f-ur);direction:rtl;text-align:right;line-height:2.25;font-size:1.02rem;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:6px 12px;margin:.6em 0}
.ur:before{content:"اردو";display:inline-block;font-size:.7rem;font-family:var(--f-body);background:var(--line);color:var(--muted);border-radius:4px;padding:0 6px;margin-left:8px;line-height:1.6}
.ur-inline{font-family:var(--f-ur);direction:rtl;unicode-bidi:isolate;line-height:2}
body.no-ur .ur,body.no-ur .ur-inline{display:none}
.eq{font-size:1.04rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:nowrap}
.qa{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:0 0 10px}
.qa>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:flex-start}
.qa>summary::-webkit-details-marker{display:none}
.qa>summary:before{content:"+";flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;margin-top:2px}
.qa[open]>summary:before{content:"−"}
.qa .body{padding:0 14px 12px 42px}
.qa .qn{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.steps{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:.4em 0}
.steps dt{font-weight:700;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.steps dd{margin:0}
.ans{font-weight:700;color:var(--good)}
.mcq{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px 14px;margin:0 0 10px}
.mcq .q{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;background:var(--paper)}
.opt input{margin-top:5px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:8px;font-size:.93rem;border-top:1px dashed var(--line);padding-top:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:700 1.7rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.notice{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:.92rem}
.notice.info{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:12px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.hero .nm{border:none;border-bottom:2px dashed var(--line);background:transparent;font:700 1.75rem var(--f-display);padding:0 2px;width:auto;max-width:260px;border-radius:0}
.list{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.searchres mark{background:var(--warn-soft);color:inherit}
.answerbox{white-space:pre-wrap}
.diagram{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto;color:#16263a}
.diagram svg{width:100%;max-width:620px;max-height:420px;height:auto;display:block;margin:auto}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.qtimer{font-variant-numeric:tabular-nums;font-weight:700}
.skeleton{color:var(--muted);padding:30px 0}
@media (prefers-reduced-motion:no-preference){.card,.qa{transition:border-color .15s}}

/* ===== 2026-11 redesign: subject themes, switcher, softer cards ===== */
:root[data-subj="phy"]{--accent:#4f46c8;--accent-soft:#ecebfb;--flame:#e0730f}
@media (prefers-color-scheme: dark){:root[data-subj="phy"]:not([data-theme="light"]){--accent:#9b95f5;--accent-soft:#25234a}}
:root[data-subj="phy"][data-theme="dark"]{--accent:#9b95f5;--accent-soft:#25234a}
:root{--r:14px;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05)}
.card,.qa,.mcq{box-shadow:var(--shadow)}
.card{border-radius:var(--r)}
.side{padding:20px 14px;gap:6px}
.brand{margin:0 4px 6px;gap:11px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 1.05rem var(--f-display);flex:none;letter-spacing:-.02em}
.brand b{font:700 1rem/1.15 var(--f-display)}
.subjsw{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:4px 0 12px}
.subjsw button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 6px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.subjsw button small{font-family:var(--f-ur);font-weight:400;font-size:.72rem;line-height:1.6}
.subjsw button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.subjsw button:hover:not([aria-pressed="true"]){color:var(--ink)}
.nav a{border-radius:10px}
.topbar{display:none}
@media (max-width:860px){
  .topbar{display:flex;position:sticky;top:0;z-index:25;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar .brand{margin:0}
  .topbar .brand b{font-size:.92rem}
  .topbar .brand .logo{width:32px;height:32px;border-radius:9px;font-size:.9rem}
  .topbar .subjsw{margin:0;flex:none}
  .topbar .subjsw button{padding:5px 10px;font-size:.8rem}
  .topbar .subjsw button small{display:none}
  .tabs{top:52px}
}
.hero{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#0b1320) 100%);color:#fff;border-radius:18px;padding:22px clamp(18px,3vw,28px);align-items:center;box-shadow:var(--shadow);margin-bottom:16px}
.hero .muted{color:rgba(255,255,255,.82)}
.hero .nm{color:#fff;border-bottom-color:rgba(255,255,255,.45)}
.hero .nm::placeholder{color:rgba(255,255,255,.7)}
.hero .btn.pri{background:#fff;color:var(--accent);border-color:#fff;padding:11px 18px;border-radius:12px;max-width:100%}
.btn svg{width:18px;height:18px;flex:none}
.hero .btn.pri{white-space:normal;text-align:left;line-height:1.25}
.cells{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.cellx{aspect-ratio:1/1}
@media (max-width:860px){.cells{grid-template-columns:repeat(3,minmax(0,1fr))}.cellx .s{font-size:1.35rem}.cellx .t{font-size:.66rem}}
.hero .chip{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;margin-right:6px}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.22) 0);display:grid;place-items:center;flex:none}
.ring b{width:58px;height:58px;border-radius:50%;background:color-mix(in srgb,var(--accent) 80%,#0b1320);display:grid;place-items:center;font:700 1.05rem var(--f-display)}
.stat b{font-size:1.55rem}
.cellx{border-radius:12px;border-width:1.5px;box-shadow:var(--shadow)}
.cellx .s{font-size:1.55rem}
.chhead .big{border-radius:12px;background:var(--accent);border-color:var(--accent)}
.chhead .big .n,.chhead .big .s{color:#fff}
.tabs button{border-radius:10px}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="wrap">
  <aside class="side" aria-label="Main navigation">
    <div class="brand" id="brand"></div>
    <div class="subjsw" id="subjsw"></div>
    <nav class="nav" id="sidenav"></nav>
    <div class="foot" id="sidefoot"></div>
  </aside>
  <main class="main" id="main"><div class="skeleton">Loading your tutor…</div></main>
</div>
<nav class="bar" id="bottomnav" aria-label="Main navigation"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<script src="js/app.js"></script>
</body>
</html>
