name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android Licenses & Install Android 36.1 SDK
        run: |
          SDKM=$(command -v sdkmanager || ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36.1" "build-tools;36.0.0" || "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore & Google Services config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub secret."
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is missing. Add repository secret DEBUG_KEYSTORE_BASE64 in GitHub Settings -> Secrets and variables -> Actions so the APK signature matches Firebase."
            exit 1
          fi
          ls -lh debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1:|SHA256:" || true

          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GitHub secret."
            else
              echo "::error::app/google-services.json is missing. Add repository secret GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets and variables -> Actions, then re-run this workflow."
              exit 1
            fi
          fi

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: gradle :app:assembleDebug --console=plain

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: class-9-learning-portal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
